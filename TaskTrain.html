<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>TaskTrainUGProject</title>

		<!-- Pyodide import for using python through the web browser -->
		<script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>

		<!-- requires a fresh cache each load, prevents being stuck on previous versions -->
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	width: 100vw;
    height: 100vh;
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="TaskTrain.icon.png" />
<link rel="apple-touch-icon" href="TaskTrain.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="TaskTrain.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="TaskTrain.js?v=<%= Date.now() %>"></script>

		<script>
			// Force fresh load every time in development
			if (!sessionStorage.getItem("freshLoad")) {
				sessionStorage.setItem("freshLoad", "1");
				window.location.reload(true);
			} else {
				sessionStorage.removeItem("freshLoad");
			}
		</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"TaskTrain","experimentalVK":false,"fileSizes":{"TaskTrain.pck":34036,"TaskTrain.wasm":35739700},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

		</script>

		<script type="text/javascript">
		let pyodide;

		async function initPyodide() {
			pyodide = await loadPyodide();

			pyodide.globals.set("talk", (msg) => {
				if (window.godotTalk) {
					window.godotTalk(String(msg));
				}
			});

			console.log("Pyodide ready");
		}

		initPyodide();

		async function runPythonFromGodot() {
			const code = window._pendingCode;
			if (!code) {
				throw new Error("No code to run");
			}
			return await pyodide.runPythonAsync(code);
		}

		let llmEngine = null;

		async function initWebLLM() {
			// Dynamically import so we can use it outside a module context
			const webllm = await import("https://esm.run/@mlc-ai/web-llm");

			llmEngine = await webllm.CreateMLCEngine(
				"Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC",
				{
					initProgressCallback: (progress) => {
						console.log("LLM progress:", progress.text);
						if (window.godotLoadProgress) {
							window.godotLoadProgress(progress.text);
						}
					}
				}
			);

			console.log("WebLLM ready");
			window.llmReady = true;
			if (window.godotLLMReady) {
				window.godotLLMReady("ready");
			}
		}

		window.runAITips = async function() {
			console.log("runAITips called");
			
			const prompt = window._pendingAIPrompt;
			console.log("prompt:", prompt ? "set" : "null");
			if (!prompt) throw new Error("No prompt set");

			console.log("engine state:", llmEngine ? "exists" : "null");
			if (!llmEngine) {
				throw new Error("LLM not ready yet");
			}

			console.log("sending to LLM...");
			const reply = await llmEngine.chat.completions.create({
				messages: [
					{ role: "user", content: prompt }
				],
				max_tokens: 300,
				temperature: 0.7
			});

			console.log("got reply:", reply);
			const text = reply.choices[0].message.content;
			console.log("AI text:", text);

			if (window.godotAIResponse) {
				window.godotAIResponse(text);
			} else {
				console.error("godotAIResponse not set on window");
			}
		}

		// Delay init slightly so Godot callbacks are registered first
		window.addEventListener("load", () => {
			setTimeout(initWebLLM, 2000);
		});

		</script>

	</body>
</html>
