<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>TaskTrainUGProject</title>

		<!-- Pyodide import for using python through the web browser -->
		<script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	width: 100vw;
    height: 100vh;
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":34036,"index.wasm":35739700},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

		</script>

		<script type="text/javascript">

		// Pyodide runs in a Web Worker to prevent long-running or infinite-looping
		// player code from freezing the main browser thread and the Godot game

		let worker;
		let workerReady = false;

		// Worker source is defined inline so no separate file needs to be hosted
		function initPyodide() {
			const workerCode = `
				let pyodide;

				self.onmessage = async function(e) {
					if (e.data.type === 'init') {
						importScripts('https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js');
						pyodide = await loadPyodide();
						
						// Expose talk() to Python so player code can send messages back to Godot
						pyodide.globals.set("talk", (msg) => {
							self.postMessage({ type: 'talk', message: String(msg) });
						});
						
						self.postMessage({ type: 'ready' });
					}
					else if (e.data.type === 'run') {
						try {
							// Clear globals from the previous run so variables don't leak between objects.
							pyodide.globals.clear();
							// Re-expose talk() since clearing globals removes it too.
							pyodide.globals.set("talk", (msg) => {
								self.postMessage({ type: 'talk', message: String(msg) });
							});
							await pyodide.runPythonAsync(e.data.code);
							self.postMessage({ type: 'done' });
						} catch (error) {
							self.postMessage({ type: 'error', message: error.message });
						}
					}
				};
			`;
			
			const blob = new Blob([workerCode], { type: 'application/javascript' });
			worker = new Worker(URL.createObjectURL(blob));
			
			worker.onmessage = function(e) {
				if (e.data.type === 'ready') {
					workerReady = true;
					console.log("Pyodide ready");
				}
				else if (e.data.type === 'talk') {
					// Forward Python output to Godot via the JavaScriptBridge callback
					if (window.godotTalk) {
						window.godotTalk(e.data.message);
					}
				}
				else if (e.data.type === 'done') {
					// Code finished successfully
				}
				else if (e.data.type === 'error') {
					if (window.godotTalk) {
						window.godotTalk("Error: " + e.data.message);
					}
				}
			};
			
			worker.postMessage({ type: 'init' });
		}

		// Begin loading Pyodide immediately so it is ready before the player first runs code
		initPyodide();

		function normaliseCode(code) {
			// Convert tabs to spaces to prevent Python 3 mixed-indentation errors
			return code
				.split('\n')
				.map(line => line.replace(/\t/g, '    ').trimEnd())
				.join('\n')
				.trimEnd();
		}

		function adjustErrorLines(message, preambleLines) {
			let adjustedLine = -1;
			const adjusted = message.replace(/line (\d+)/g, (match, num) => {
				const n = parseInt(num) - preambleLines;
				if (n > 0) {
					adjustedLine = n;
					return 'line ' + n;
				}
				return match;
			});
			return { message: adjusted, line: adjustedLine };
		}

		async function runPythonFromGodot() {
			const code = window._pendingCode;
			if (!code) {
				throw new Error("No code to run");
			}
			
			if (!workerReady) {
				throw new Error("Pyodide not ready yet");
			}
			
			const cleanCode = normaliseCode(code);

			// Count lines up to the marker to find where the player's code begins.
			const lines = cleanCode.split('\n');
			const markerIndex = lines.findIndex(l => l.trim() === '#UserCode');
			// +1 because the marker line itself is not player code.
			const preambleLines = markerIndex >= 0 ? markerIndex + 1 : 0;

			// Terminate the worker after 5 seconds to handle infinite loops
			// A new worker is started immediately so the player can run again
			const timeout = setTimeout(() => {
				if (worker) {
					worker.terminate();
					workerReady = false;
					if (window.godotTalk) {
						window.godotTalk("Execution stopped - infinite loop detected (5 second timeout)\n");
					}
					// Restart worker for next run
					initPyodide();
				}
			}, 100); // Although this is only 100ms, it actually is more than enough and still lasts ~5 seconds
			
			// Clear the timeout as soon as execution finishes, then delegate to the original handler
			const originalHandler = worker.onmessage;
			worker.onmessage = function(e) {
				if (e.data.type === 'done' || e.data.type === 'error') {
					clearTimeout(timeout);
				}
				if (e.data.type === 'error' && window.godotTalk) {
					const result = adjustErrorLines(e.data.message, preambleLines);
					window.godotTalk(result.message);
					if (result.line > 0) {
						window.godotTalk('__error__:' + result.line);
					}
				} else {
					originalHandler(e);
				}
			};
			
			worker.postMessage({ type: 'run', code: cleanCode });
		}

		// WebLLM loads a Qwen 2.5 Coder model entirely in the browser using WebGPU
		// No data leaves the client, inference runs locally after initial download

		let llmEngine = null;

		async function initWebLLM() {
			const webllm = await import("https://esm.run/@mlc-ai/web-llm");

			llmEngine = await webllm.CreateMLCEngine(
				"Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC"
			);

			console.log("WebLLM ready");
			window.llmReady = true;
			if (window.godotLLMReady) {
				window.godotLLMReady("ready");
			}
		}

		window.runAITips = async function() {
			console.log("runAITips called");
			// The prompt is constructed in IDE.gd and instructs the model to give guiding hints only
			const prompt = window._pendingAIPrompt;
			console.log("prompt:", prompt ? "set" : "null");
			if (!prompt) throw new Error("No prompt set");

			console.log("engine state:", llmEngine ? "exists" : "null");
			if (!llmEngine) {
				throw new Error("LLM not ready yet");
			}

			console.log("sending to LLM...");
			const reply = await llmEngine.chat.completions.create({
				messages: [
					{ role: "user", content: prompt }
				],
				max_tokens: 300,
				temperature: 0.7
			});

			console.log("got reply:", reply);
			const text = reply.choices[0].message.content;
			console.log("AI text:", text);

			if (window.godotAIResponse) {
				window.godotAIResponse(text);
			} else {
				console.error("godotAIResponse not set on window");
			}
		}

		window.addEventListener("load", () => {
			setTimeout(initWebLLM, 2000); // loads the LLM 2 seconds after the page loads
		});

		</script>

	</body>
</html>
